name: DataSift (MediaSift Inc.)
description: >-
  DataSift (MediaSift Inc.) was a pioneering social data platform that provided
  real-time and historical access to social media firehoses (Twitter, Facebook
  Topic Data, and more) through its CSDL filtering language and its Push,
  Historics, and Managed Sources REST APIs. Founded in 2007 and backed by
  Insight Partners and others, the company was acquired by Meltwater in 2019;
  the datasift.com domain now redirects to meltwater.com and the standalone
  DataSift developer platform and APIs have been discontinued. Official
  first-party client SDKs for Python, Ruby, PHP, Java, and Node.js remain
  published on public package registries under the datasift GitHub organization
  as historical artifacts.
